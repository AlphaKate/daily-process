<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Twilight to Midnight Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111c35" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Subtle Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ambient Center Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Dawn Sunrise Radial Glow at Bottom -->
    <radialGradient id="dawnGlow" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Ascent Growth Vector Gradient -->
    <linearGradient id="ascentGrad" x1="15%" y1="75%" x2="85%" y2="25%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Ascending Stroke -->
    <filter id="vectorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>

    <filter id="starShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#fbbf24" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- iOS-Style App Icon Squircle Background -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Glow layers -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#ambientGlow)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#dawnGlow)" />

  <!-- 1. The Horizon / Dawn Arc at Bottom (Daily renewal) -->
  <path d="M 120 400 Q 256 340 392 400" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 160 420 Q 256 375 352 420" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.25" />

  <!-- 2. The Goals & Focus Target Rings (Concentric Circles of Growth) -->
  <!-- Outer Target Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 10" opacity="0.5" />
  <path d="M 256 108 A 148 148 0 0 1 404 256" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.75" />
  <path d="M 108 256 A 148 148 0 0 1 256 108" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  <!-- Middle Target Ring (Milestones) -->
  <circle cx="256" cy="256" r="102" fill="none" stroke="#1e293b" stroke-width="3" opacity="0.8" />
  <circle cx="256" cy="256" r="102" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="8 8" opacity="0.45" />

  <!-- Inner Focus Target Core -->
  <circle cx="256" cy="256" r="54" fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.3" />

  <!-- Cardinal Compass Calibration Dots (Focus alignment) -->
  <circle cx="256" cy="108" r="4.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="404" cy="256" r="4" fill="#38bdf8" opacity="0.6" />
  <circle cx="256" cy="404" r="3.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="108" cy="256" r="4" fill="#10b981" opacity="0.6" />

  <!-- 3. The Ascending Growth Vector & Checkmark (Process & Accomplishment) -->
  <path
    d="M 148 270 
       C 172 294, 202 328, 224 350 
       C 246 322, 285 244, 362 165"
    fill="none"
    stroke="url(#ascentGrad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#vectorShadow)"
  />

  <!-- Inner bright core highlight on the ascent stroke -->
  <path
    d="M 152 270 
       C 174 294, 202 326, 224 348 
       C 246 322, 285 244, 360 167"
    fill="none"
    stroke="#ffffff"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.65"
  />

  <!-- 4. The Guiding Zenith Star (Summit of Goal & Vision) at (365, 160) -->
  <!-- Radiant Aura -->
  <circle cx="365" cy="160" r="50" fill="url(#starGlow)" opacity="0.65" />

  <!-- 4-Point Radiant Diamond Star -->
  <path
    d="M 365 118 
       Q 365 160 323 160 
       Q 365 160 365 202 
       Q 365 160 407 160 
       Q 365 160 365 118 Z"
    fill="#ffffff"
    filter="url(#starShadow)"
  />

  <!-- Golden Core Center of the Star -->
  <circle cx="365" cy="160" r="6" fill="#fef08a" />
</svg>
